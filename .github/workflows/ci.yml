name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit tests are headless and offline; verify also packages the jar.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      # Runs the real entry point for a few generations with no window.
      - name: Headless smoke run
        run: ./mvnw -q -B --no-transfer-progress exec:java -Dexec.args="--headless 3 --population 500 --seed 1 --log target/smoke.csv"

      - name: Check smoke output
        run: test "$(wc -l < target/smoke.csv)" -eq 4
